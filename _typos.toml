# Spell check config for typos (https://github.com/crate-ci/typos). Copied to _typos.toml.
[files]
extend-exclude = ["*.lock", "node_modules", "dist", "build", "*.svg", "*.min.js"]

# Binary images are not text. Excluded by type because the pre-commit hook passes files by name,
# which bypasses extend-exclude.
[type.png]
extend-glob = ["*.png"]
check-file = false

[default.extend-words]
# Intentional words that look like typos go here, one per line, as: word = "word"
# A deliberately unparseable timebox in the time check tests (tests/test_time_check.py).
nd = "nd"
